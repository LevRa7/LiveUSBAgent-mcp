# Continuous integration: the checks that must hold before anything is released.
#
# The node updates itself from a release, so a broken release is not "one bad
# download" - it is every node in the mesh restarting onto it. The updater and
# version suites are therefore a hard gate, and the wider suite runs as a second
# (also hard) gate on Linux and Windows.
#
# The suite needs a real interpreter and nothing else: the node's only runtime
# dependency is websockets, and the optional MCP-SDK tests skip themselves when
# the SDK is absent.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          # No "cache: pip": this repository has no requirements.txt and no
          # pyproject.toml (the node's only dependency is websockets, installed
          # below), and setup-python fails the job outright when it is asked to
          # cache a file that does not exist.
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pydantic uvicorn starlette websockets requests httpx
        shell: bash

      - name: Version gate
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -p no:cacheprovider tests/test_version_single_source.py
        shell: bash

      - name: Full suite
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -p no:cacheprovider
        shell: bash

  creator-linux-deb:
    name: Linux LiveUSB Creator (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and install .deb
        run: |
          python tools/build-creator-deb.py
          deb="$(ls -1 dist/liveusb-agent-creator_*_all.deb | head -n 1)"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb"
          sudo apt-get update
          sudo apt-get install -y "./$deb"
          liveusb-agent-creator --self-test

      - uses: actions/upload-artifact@v4
        with:
          name: creator-deb
          path: dist/liveusb-agent-creator_*_all.deb*
          if-no-files-found: error

  creator-macos-dmg:
    name: macOS LiveUSB Creator (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal macOS .dmg
        run: bash tools/build-creator-macos.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: creator-dmg
          path: dist/LiveUSBAgent-Creator-*-macOS.dmg*
          if-no-files-found: error

  # This repository is public, so a credential that reaches it is a published
  # credential: the scan is a hard gate, not a warning. The full history is
  # fetched because a secret that was committed and then deleted stays readable
  # from the old commit - which is exactly how the mesh once leaked an SSH
  # password through task_metrics.json. The default ruleset covers the whole tree
  # and the whole history as it is, with no repository-specific allowlist.
  secret-scan:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
