# LiveUSB ISO checks and multi-arch ISO build (amd64 / arm64 / i386).
#
# * `checks` runs on every pull request: LiveUSB unit/contract tests (including
#   Cloudflare Quick Tunnel) plus `build-iso.sh --check` across all 3 arches
#   and profiles (full / compact / lite).
# * `iso` builds real hybrid ISOs in Debian containers on `workflow_dispatch`
#   or a `v*` tag push:
#     - amd64 -> debian:trixie on ubuntu-24.04 (BIOS + UEFI)
#     - arm64 -> debian:trixie on ubuntu-24.04-arm (UEFI, native ARM64 runner)
#     - i386  -> debian:bookworm on ubuntu-24.04 (BIOS 686-pae, lite TUI)
# * On `v*` tag pushes, built ISOs and SHA-256 checksums are attached to the
#   matching GitHub Release automatically.

name: LiveUSB ISO

on:
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: "Image profile for amd64/arm64 (i386 always uses lite)"
        type: choice
        default: compact
        options:
          - compact
          - full
          - lite
      arch:
        description: "Target architecture(s) to build"
        type: choice
        default: all
        options:
          - all
          - amd64
          - arm64
          - i386
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  checks:
    name: LiveUSB assets and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pydantic uvicorn starlette websockets requests httpx

      - name: LiveUSB test modules
        env:
          PYTHONIOENCODING: utf-8
        run: >
          python -m pytest -q -p no:cacheprovider
          tests/test_liveusb_cloudflare_tunnel.py
          tests/test_liveusb_iso_pipeline.py
          tests/test_liveusb_bootstrap.py
          tests/test_liveusb_gateway.py
          tests/test_kiosk_server.py
          tests/test_rescue.py
          tests/test_skills_loader.py
          tests/test_autoruns.py

      - name: Validate ISO assets across all arches and profiles
        run: |
          bash ops/live-usb/build-iso.sh --arch amd64 --profile full --check
          bash ops/live-usb/build-iso.sh --arch amd64 --profile compact --check
          bash ops/live-usb/build-iso.sh --arch amd64 --profile lite --check
          bash ops/live-usb/build-iso.sh --arch arm64 --profile compact --check
          bash ops/live-usb/build-iso.sh --arch i386 --profile lite --check

      - name: ShellCheck the LiveUSB scripts (when installed)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --severity=error -x \
              ops/live-usb/build-iso.sh \
              ops/live-usb/start-kiosk.sh \
              ops/live-usb/fetch-skills.sh \
              ops/live-usb/test-qemu.sh \
              ops/live-usb/hooks/0100-build-apfs-and-drivers.hook.chroot \
              ops/live-usb/hooks/0300-purge-build-deps.hook.chroot
          else
            echo "shellcheck is not installed here; skipping"
          fi

  plan:
    name: Plan ISO build matrix
    if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Build target architecture matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ARCH: ${{ github.event.inputs.arch }}
        run: |
          python3 - << 'PY' >> "$GITHUB_OUTPUT"
          import json, os

          entries = [
              {
                  "arch": "amd64",
                  "distro": "trixie",
                  "runner": "ubuntu-24.04",
                  "container": "debian:trixie",
                  "grub_pkgs": "grub-efi-amd64-bin grub-pc-bin",
              },
              {
                  "arch": "arm64",
                  "distro": "trixie",
                  "runner": "ubuntu-24.04-arm",
                  "container": "debian:trixie",
                  "grub_pkgs": "grub-efi-arm64-bin",
              },
              {
                  "arch": "i386",
                  "distro": "bookworm",
                  "runner": "ubuntu-24.04",
                  "container": "debian:bookworm",
                  "grub_pkgs": "grub-pc-bin",
              },
          ]

          event = os.environ.get("EVENT_NAME", "")
          wanted = (os.environ.get("INPUT_ARCH") or "all").strip()
          if event == "workflow_dispatch" and wanted and wanted != "all":
              entries = [e for e in entries if e["arch"] == wanted]

          print("include=" + json.dumps(entries, separators=(",", ":")))
          PY

  iso:
    name: ISO build (${{ matrix.arch }}, ${{ matrix.distro }})
    needs: [plan]
    if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
      options: --privileged
    continue-on-error: true
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.include) }}
    steps:
      - name: Install git and live-build toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates python3 \
            live-build debootstrap squashfs-tools xorriso \
            ${{ matrix.grub_pkgs }} mtools dosfstools cpio curl jq

      - uses: actions/checkout@v4

      - name: Resolve profile and version
        id: meta
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ "${{ matrix.arch }}" == "i386" ]]; then
            PROFILE="lite"
          else
            PROFILE="${{ github.event.inputs.profile || 'full' }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "profile=${PROFILE}" >> "$GITHUB_OUTPUT"
          echo "iso_name=LiveUSBAgent-${VERSION}-${{ matrix.arch }}-${PROFILE}.iso" >> "$GITHUB_OUTPUT"

      - name: Validate checkout before building
        run: >-
          bash ops/live-usb/build-iso.sh
          --arch "${{ matrix.arch }}"
          --distro "${{ matrix.distro }}"
          --profile "${{ steps.meta.outputs.profile }}"
          --check

      - name: Build hybrid ISO
        env:
          WORK_DIR: ${{ github.workspace }}/build
        run: >-
          bash ops/live-usb/build-iso.sh
          --arch "${{ matrix.arch }}"
          --distro "${{ matrix.distro }}"
          --profile "${{ steps.meta.outputs.profile }}"
          --tunnel cloudflare
          --build

      - name: Package ISO and SHA-256
        run: |
          mkdir -p dist
          ISO_SRC="$(ls -1 build/live-image-*.iso | head -n 1)"
          OUT="dist/${{ steps.meta.outputs.iso_name }}"
          mv "${ISO_SRC}" "${OUT}"
          (cd dist && sha256sum "${{ steps.meta.outputs.iso_name }}" > "${{ steps.meta.outputs.iso_name }}.sha256")
          ls -lh dist/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: liveusb-iso-${{ matrix.arch }}-${{ steps.meta.outputs.profile }}
          path: dist/LiveUSBAgent-*.iso*
          if-no-files-found: warn
          retention-days: 14

  attach-release:
    name: Attach multi-arch ISOs to GitHub Release
    needs: [iso]
    if: startsWith(github.ref, 'refs/tags/v') && always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built ISO artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: liveusb-iso-*
          path: release-isos
          merge-multiple: true

      - name: Upload ISOs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(release-isos/LiveUSBAgent-*.iso release-isos/LiveUSBAgent-*.iso.sha256)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No ISO artifacts were produced; skipping release upload."
            exit 0
          fi
          if ! gh release view "${TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release create "${TAG}" --repo "${GH_REPO}" --title "${TAG}" --generate-notes
          fi
          gh release upload "${TAG}" "${files[@]}" --repo "${GH_REPO}" --clobber
