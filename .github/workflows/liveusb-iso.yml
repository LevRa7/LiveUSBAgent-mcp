# LiveUSB ISO checks and (optional) ISO build.
#
# Two jobs, on purpose:
#
# * `checks` runs on every pull request and costs a couple of minutes: it is the
#   gate that keeps the LiveUSB layer honest (rescue/kiosk/bootstrap tests plus
#   `build-iso.sh --check`, which validates the assets the image is built from
#   without needing root or live-build).
# * `iso` produces a real ISO in a `debian:trixie` container. It is deliberately
#   NOT triggered by a pull request: a live-build run debootstraps a whole Debian
#   system, compiles DKMS modules and downloads a few hundred megabytes, which is
#   minutes-to-an-hour of runner time and a network dependency on Debian mirrors.
#   It runs only on `workflow_dispatch` or a `v*` tag, and it is
#   `continue-on-error`, so a flaky mirror or an upstream package change cannot
#   turn into a red build for an unrelated change.
#
# This workflow does not touch releases: release.yml owns versioning, payloads and
# installer assets. Here the ISO is only an artifact for manual testing.

name: LiveUSB ISO

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  checks:
    name: LiveUSB assets and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # What the LiveUSB modules import (the kiosk server and the gateway
          # contract tests pull in starlette/uvicorn/websockets; pydantic and
          # httpx come from the shared test helpers).
          python -m pip install pytest pytest-asyncio pydantic uvicorn starlette websockets requests httpx

      - name: LiveUSB test modules
        env:
          PYTHONIOENCODING: utf-8
        run: >
          python -m pytest -q -p no:cacheprovider
          tests/test_liveusb_iso_pipeline.py
          tests/test_liveusb_bootstrap.py
          tests/test_liveusb_gateway.py
          tests/test_kiosk_server.py
          tests/test_rescue.py
          tests/test_skills_loader.py
          tests/test_autoruns.py

      - name: Validate the ISO assets (no root, no live-build)
        run: bash ops/live-usb/build-iso.sh --check

      - name: ShellCheck the LiveUSB scripts (when installed)
        run: |
          # Errors only: the scripts predate a strict style gate, and a warning
          # about quoting is not a reason to block a pull request. `bash -n` is
          # already enforced by `build-iso.sh --check`.
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --severity=error -x \
              ops/live-usb/build-iso.sh \
              ops/live-usb/start-kiosk.sh \
              ops/live-usb/fetch-skills.sh \
              ops/live-usb/test-qemu.sh \
              ops/live-usb/hooks/0100-build-apfs-and-drivers.hook.chroot
          else
            echo "shellcheck is not installed here; skipping (install it to enable)"
          fi

  iso:
    name: ISO build (manual or tag, debian:trixie)
    # No pull requests, no pushes to main: this job is an artifact producer.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - name: Install git and the live-build toolchain
        # Before checkout on purpose: a bare debian:trixie image has no git, and
        # actions/checkout needs it inside a container job.
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates python3 \
            live-build debootstrap squashfs-tools xorriso \
            grub-efi-amd64-bin grub-pc-bin mtools dosfstools curl jq

      - uses: actions/checkout@v4

      - name: Validate the checkout before building
        run: bash ops/live-usb/build-iso.sh --check

      - name: Build the hybrid ISO
        env:
          WORK_DIR: ${{ github.workspace }}/build
        run: bash ops/live-usb/build-iso.sh --build

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: liveusb-iso
          path: build/live-image-*.iso
          if-no-files-found: warn
          retention-days: 14
